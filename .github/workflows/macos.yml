# Builds and tests duckmidi on macOS (Apple Silicon).
name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja pkgconf sdl3 fluid-synth

      # Homebrew's FFmpeg lacks some export encoders, so build the same minimal FFmpeg as Windows.
      - name: Restore FFmpeg
        id: ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: build/development/ffmpeg-minimal-work/prefix
          key: ffmpeg-minimal-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build-ffmpeg-minimal.sh') }}

      - name: Build FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: cmake -P tools/build-ffmpeg-minimal.cmake

      - name: Save FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/development/ffmpeg-minimal-work/prefix
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      - name: Configure
        run: cmake -S . -B build/development/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/development/ffmpeg-minimal-work/prefix;$(brew --prefix)"

      - name: Build
        run: cmake --build build/development/cmake

      - name: Test
        run: ctest --test-dir build/development/cmake --output-on-failure

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duckmidi-macos-arm64
          path: build/development/cmake/bin/
          if-no-files-found: ignore

      - name: Upload FFmpeg build log
        if: failure() && steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-minimal-macos-log
          path: agents/reports/ffmpeg-minimal/
          if-no-files-found: ignore
