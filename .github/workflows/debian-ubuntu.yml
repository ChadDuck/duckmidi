# Builds and tests duckmidi on Ubuntu 26.04 and Debian 13; locally built FluidSynth 2.5.4.
name: Ubuntu / Debian

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-26.04
            image: ubuntu:26.04
          - name: debian-13
            image: debian:13
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential cmake ninja-build pkg-config git libsdl3-dev libasound2-dev libglib2.0-dev libsndfile1-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev

      - uses: actions/checkout@v4

      - name: Build FluidSynth 2.5.4
        run: |
          git clone --depth 1 --branch v2.5.4 https://github.com/FluidSynth/fluidsynth.git build/development/deps/fluidsynth
          cmake -S build/development/deps/fluidsynth -B build/development/deps/fluidsynth-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH="$PWD/build/development/deps/install" -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build build/development/deps/fluidsynth-build
          cmake --install build/development/deps/fluidsynth-build

      - name: Configure
        run: cmake -S . -B build/development/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH:PATH="$PWD/build/development/deps/install"

      - name: Build
        run: cmake --build build/development/cmake

      - name: Test
        run: ctest --test-dir build/development/cmake --output-on-failure

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duckmidi-${{ matrix.name }}-x86_64
          path: build/development/cmake/bin/
          if-no-files-found: ignore
